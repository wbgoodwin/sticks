# Reference design from the PRD: an 18x14 lean-to shed, 10' tall at the
# front, on piers. The roof pitch is still an open question, so 3:12 is a
# placeholder; the back and side walls take their heights from it.
name = "Backyard shed"

[rules]
on_center = "16\""
kerf = "1/8\""
wall_lumber = "2x4"
layout_from = "left"

[building]
width = "18'"          # along the front wall
depth = "14'"
height = "10'"         # the front wall; the roof slopes down to the back

[floor]
joist = "2x6"
beam = "4x6"
beams = 3              # front, middle and back
support = "piers"
pier_spacing = "6'"

[roof]
pitch = "3:12"
rafter = "2x6"
front_overhang = "12\""
back_overhang = "12\""

[[stock]]
size = "2x4"
lengths = ["8'", "10'", "12'", "16'"]

[[stock]]
size = "2x6"
lengths = ["8'", "10'", "12'", "14'", "16'", "18'"]

[[sheet]]
thickness = "3/4\""    # subfloor

# The building's walls (front, back, left, right) take their size from
# [building]; list one here only to add openings or tees.
[[wall]]
id = "front"

[[wall.opening]]
kind = "door"
offset = "7' 3\""
width = "38-1/2\""
height = "82-1/2\""
header = "2x8"

[[wall.opening]]
kind = "penetration"   # mini-split line set
offset = "15'"
width = "4\""
height = "4\""
sill_height = "1'"
header = "2x4"
