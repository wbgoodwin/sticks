# Reference design from the PRD: an 18x14 lean-to shed, 10' tall at the
# front, its beams on short posts on concrete piers, with a covered porch and
# deck across the front. The roof is 2:12, which brings the back wall to
# 7' 8-9/16"; the side walls rake between the two.
name = "Backyard shed"

[rules]
on_center = "16\""
kerf = "1/8\""
wall_lumber = "2x4"
layout_from = "left"

[building]
width = "18'"          # along the front wall
depth = "14'"
height = "10'"         # the front wall; the roof slopes down to the back

[floor]
joist = "2x6"
beam = "4x6"
beams = 3              # front, middle and back
support = "posts"         # short 4x4 posts on concrete piers
pier_spacing = "6'"

[roof]
pitch = "2:12"
rafter = "2x6"
front_overhang = "12\""
back_overhang = "12\""

# A porch across the front: 4x4 posts on a deck a step below the shed floor,
# carrying a doubled 2x8 beam and a roof hung from a ledger on the front wall.
[porch]
depth = "6'"
post = "4x4"
beam = "2x8"
beam_plies = 2

[porch.deck]
beam = "4x6"
decking = "5/4x6"
step_down = "1\""

# 7/16" sheathing under the cedar shingle siding, 1/2" on the roofs.
[sheathing]
wall = "7/16\""
roof = "1/2\""

[[stock]]
size = "2x4"
lengths = ["8'", "10'", "12'", "16'"]

[[stock]]
size = "2x6"
lengths = ["8'", "10'", "12'", "14'", "16'", "18'"]

[[sheet]]
thickness = "3/4\""    # subfloor

[[sheet]]
thickness = "7/16\""   # wall sheathing

[[sheet]]
thickness = "1/2\""    # roof sheathing

# The building's walls (front, back, left, right) take their size from
# [building]; list one here only to add openings or tees.
[[wall]]
id = "front"

[[wall.opening]]
kind = "door"
offset = "7' 3\""
width = "38-1/2\""
height = "82-1/2\""
header = "2x8"

[[wall.opening]]
kind = "penetration"   # mini-split line set
offset = "15'"
width = "4\""
height = "4\""
sill_height = "1'"
header = "2x4"
