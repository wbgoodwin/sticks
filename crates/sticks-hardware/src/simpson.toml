# Simpson Strong-Tie connectors for the joints Sticks frames.
#
# Each part lists the joints it fits, the sizes of the member it holds (and of
# what it sits on, where that matters), and the nails per piece from Simpson's
# catalog tables. `exposed` is the ZMAX model, used outdoors and against
# treated lumber. Fastener counts were read from Simpson catalog pages hosted
# by distributors in October 2026; check the current catalog before you build.

brand = "Simpson Strong-Tie"

# Nails, and the Strong-Drive SD connector screw that goes in their holes
# instead. Nail boxes are 1 lb, so their counts are approximate.

[[fastener]]
key = "8d"
name = "8d common nail, 0.131 x 2-1/2\" (1 lb box)"
screw = "SD9112"
screw_name = "SD connector screw, #9 x 1-1/2\" (box of 100)"
nails_per_box = 106
screws_per_box = 100

[[fastener]]
key = "10d"
name = "10d common nail, 0.148 x 3\" (1 lb box)"
screw = "SD9212"
screw_name = "SD connector screw, #9 x 2-1/2\" (box of 100)"
nails_per_box = 69
screws_per_box = 100

[[fastener]]
key = "10d x 1-1/2"
name = "10d connector nail, 0.148 x 1-1/2\" (1 lb box)"
screw = "SD9112"
screw_name = "SD connector screw, #9 x 1-1/2\" (box of 100)"
nails_per_box = 135
screws_per_box = 100

[[fastener]]
key = "16d"
name = "16d common nail, 0.162 x 3-1/2\" (1 lb box)"
screw = "SD10212"
screw_name = "SD connector screw, #10 x 2-1/2\" (box of 100)"
nails_per_box = 49
screws_per_box = 100

# Rafters and joists sitting on a plate or beam: five nails into each.

[[part]]
model = "H2.5A"
exposed = "H2.5AZ"
name = "hurricane tie"
joints = ["rafter_on_plate", "rafter_on_beam", "joist_on_beam"]
sizes = ["2x4", "2x6", "2x8", "2x10", "2x12"]
nails = { "8d" = 10 }

