[package]
name = "sticks-app"
description = "Sticks desktop app"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wbgoodwin/sticks"

# Kept out of the main workspace so building the core and CLI never needs the
# system webview libraries Tauri links against.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sticks-intent = { path = "../../crates/sticks-intent" }
sticks-local = { path = "../../crates/sticks-local" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
# Plain-English edits with a model on this machine when Jev can't be reached.
# Needs cmake and a C++ compiler to build llama.cpp. Uses the GPU on a Mac.
local-model = ["sticks-local/llama"]
